[project]
name = "announcement-evidence-desk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Evidence-grounded announcement review with persisted model runs and human decisions"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "sqlalchemy==2.0.52",
  "psycopg[binary]==3.3.5",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.32",
  "pypdf==6.18.1",
  "google-genai==2.23.0",
  "pymupdf==1.28.2",
  "beautifulsoup4==4.15.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.vercel]
entrypoint = "desk.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"
